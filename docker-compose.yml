version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: budget-manager-app
        container_name: budgets-manager-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
            - APP_KEY=base64:CoYApKV6UKIfl2IQbkCpfoBBTWA0KldJuQtja9Pamv4=
            - DB_CONNECTION=mysql
            - DB_HOST=db
            - DB_PORT=3307
            - DB_DATABASE=laravel
            - DB_USERNAME=root
            - DB_PASSWORD=password
        networks:
            - laravel

    db:
        image: mysql:8.0
        container_name: laravel-db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: budget_manager
            MYSQL_USER: budget_user
            MYSQL_PASSWORD: secret
        volumes:
            - dbdata:/var/lib/mysql
        ports:
            - "3307:3306"  # Fix port mapping (should be 3306 inside the container)
        networks:
            - laravel

    web:
        image: nginx:alpine
        container_name: laravel-web
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./nginx/conf.d:/etc/nginx/conf.d
        networks:
            - laravel

volumes:
    dbdata:

networks:
    laravel:
        driver: bridge
